<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doorpi Files</title>
    <link rel="stylesheet" href="style.css?v=20260721f">
    <link rel="stylesheet" href="file-browser.css?v=20260721l">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
        .doorpi-file-browser .dfb-backdrop { background: rgba(7, 9, 13, .66); }
    </style>
</head>
<body>
    <script>
        (() => {
            const post = payload => window.chrome?.webview?.postMessage(JSON.stringify(payload));

            window._vkbOpen = input => {
                if (!input) return false;
                input.focus();
                window._vkbIsOpen = true;
                const rect = input.getBoundingClientRect();
                post({
                    action: 'doorpiFileBrowserKeyboardOpen',
                    top: rect.top,
                    bottom: rect.bottom
                });
                return true;
            };

            window.__doorpiNativeVkbHasActiveInput = () =>
                !!document.activeElement?.matches?.('input, textarea');
            window.__doorpiNativeVkbClose = () => {
                window._vkbIsOpen = false;
                return true;
            };

            window.__doorpiNativeVkbKey = key => {
                const input = document.activeElement;
                if (!input || !input.matches('input, textarea')) return;
                const start = input.selectionStart ?? input.value.length;
                const end = input.selectionEnd ?? start;
                const replace = value => {
                    input.setRangeText(value, start, end, 'end');
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                };
                if (key === 'BKSP') {
                    if (start !== end) replace('');
                    else if (start > 0) {
                        input.setSelectionRange(start - 1, end);
                        input.setRangeText('', start - 1, end, 'end');
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                } else if (key === 'SPACE') replace(' ');
                else if (key === 'CURSOR_LEFT') input.setSelectionRange(Math.max(0, start - 1), Math.max(0, start - 1));
                else if (key === 'CURSOR_RIGHT') input.setSelectionRange(Math.min(input.value.length, end + 1), Math.min(input.value.length, end + 1));
                else if (key === 'ENTER') {
                    window._vkbIsOpen = false;
                    if (input.id === 'dfbDialogInput') document.getElementById('dfbDialogConfirm')?.click();
                    else if (input.id === 'dfbPathInput') document.getElementById('dfbGoPath')?.click();
                }
                else if (!['CANCEL', 'SHIFT', 'SYM', 'ABC'].includes(key)) replace(String(key));
            };

            document.addEventListener('focusin', event => {
                if (event.target?.id !== 'dfbDialogInput' || window._vkbIsOpen) return;
                setTimeout(() => window._vkbOpen?.(event.target), 0);
            });

            document.addEventListener('keydown', event => {
                if (!window.isDoorpiFileBrowserOpen?.() || window._vkbIsOpen) return;
                const direction = { ArrowRight: 'RIGHT', ArrowLeft: 'LEFT', ArrowDown: 'DOWN', ArrowUp: 'UP' }[event.key];
                if (direction) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    window.DoorpiFileBrowser?.moveFocus?.(direction);
                    return;
                }
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    window.DoorpiFileBrowser?.activate?.();
                    return;
                }
                if (event.key === 'Escape' || event.key === 'Backspace' || event.key === 'BrowserBack') {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    window.DoorpiFileBrowser?.back?.();
                    return;
                }
                const editing = document.activeElement?.matches?.('input, textarea');
                if ((event.key || '').toLowerCase() === 'x' && !editing) {
                    event.preventDefault();
                    window.DoorpiFileBrowser?.context?.();
                } else if ((event.key || '').toLowerCase() === 'y' && !editing) {
                    event.preventDefault();
                    window.DoorpiFileBrowser?.createFolder?.();
                }
            }, true);
        })();
    </script>
    <script src="file-browser.js?v=20260721o"></script>
</body>
</html>
